# Nginx IP地址+文件夹名访问配置

# 此配置文件允许您通过 IP地址+文件夹名 的方式访问特定文件夹中的index.html
# 例如: http://您的IP地址/special-folder

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    charset utf-8;
    server_tokens off;

    # 主网站根目录（现有的博客网站）
    root /Volumes/ztx-1t/zackblog/dist;
    index index.html;

    # =====================================================
    #           自定义文件夹访问配置
    # =====================================================
    
    # 配置1: 访问dist/happy-birthday目录
    # 访问方式: http://您的IP地址/happy-birthday
    location /happy-birthday {
        alias /Volumes/ztx-1t/zackblog/dist/happy-birthday;
        index index.html;
        
        # 允许列出目录内容（可选，如果需要查看文件夹中的所有文件）
        # autoindex on;
        # autoindex_exact_size off;
        # autoindex_localtime on;
        
        # 处理该目录下的所有请求
        try_files $uri $uri/ =404;
    }
    
    # 配置示例2: 访问自定义文件夹（假设在public目录下创建custom目录）
    # 访问方式: http://您的IP地址/custom
    location /custom {
        alias /Volumes/ztx-1t/zackblog/public/custom;
        index index.html;
        try_files $uri $uri/ =404;
    }
    
    # 配置示例3: 访问项目外部的文件夹
    # 访问方式: http://您的IP地址/external
    # location /external {
    #     alias /path/to/external/folder;
    #     index index.html;
    #     try_files $uri $uri/ =404;
    # }
    
    # =====================================================
    #           静态文件处理
    # =====================================================
    
    # 为自定义文件夹中的静态资源（CSS、JS、图片等）设置缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    
    # =====================================================
    #           主网站配置
    # =====================================================
    
    # 主网站的其他路径配置
    location / {
        try_files $uri $uri.html =404;
    }
    
    # 保护隐藏文件和敏感文件
    location ~ /\. {
        deny all;
        return 404;
    }
    
    location ~* \.(conf|ini|log|sh)$ {
        deny all;
        return 404;
    }
    
    # =====================================================
    #           错误页面配置
    # =====================================================
    
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /500.html;
    
    location = /404.html {
        internal;
    }
    location = /403.html {
        internal;
    }
    location = /500.html {
        internal;
    }
    
    # =====================================================
    #           日志配置
    # =====================================================
    
    access_log /var/log/nginx/ip-folder-access.log;
    error_log /var/log/nginx/ip-folder-error.log;
}

# =====================================================
#                 应用配置的步骤
# =====================================================

# 1. 首先备份当前的Nginx配置
# sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.backup
# 或根据您当前使用的配置文件路径进行备份

# 2. 将此配置文件复制到Nginx配置目录
# sudo cp /Volumes/ztx-1t/zackblog/nginx-ip-folder-config.conf /etc/nginx/conf.d/

# 3. 测试配置语法是否正确
# sudo nginx -t

# 4. 重载Nginx配置使更改生效
# sudo systemctl reload nginx
# 或在某些系统上：
# sudo service nginx reload

# =====================================================
#                 自定义配置说明
# =====================================================

# 如果您想添加更多的文件夹访问配置，请按照以下格式添加新的location块：

# location /your-folder-name {
#     alias /path/to/your/folder;
#     index index.html;
#     try_files $uri $uri/ =404;
# }

# 重要说明：
# - 将/your-folder-name替换为您想要在URL中使用的路径名称
# - 将/path/to/your/folder替换为实际的文件夹路径
# - 确保Nginx用户（通常是www-data或nginx）对该文件夹有读取权限

# =====================================================
#                 权限设置
# =====================================================

# 如果遇到权限问题，请确保Nginx用户有权访问您的文件夹：
# sudo chown -R www-data:www-data /path/to/your/folder
# sudo chmod -R 755 /path/to/your/folder

# =====================================================
#                 测试访问
# =====================================================

# 配置完成后，您可以通过以下方式测试访问：
# 1. 打开浏览器
# 2. 输入 http://您的IP地址/配置的文件夹名
# 例如：http://192.168.1.100/happy-birthday

# 如果无法访问，请检查：
# 1. Nginx配置是否正确
# 2. 文件夹路径是否正确
# 3. 文件夹权限是否设置正确
# 4. 防火墙是否允许80端口访问
# 5. 查看Nginx错误日志获取详细信息