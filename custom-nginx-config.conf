# 自定义Nginx配置文件
# 用于解决博客主页访问出现404错误的问题

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080 default_server;  # 使用8080端口避免需要root权限
        listen [::]:8080 default_server;
        server_name localhost;
        charset utf-8;
        server_tokens off;

        # 主网站根目录（博客网站）
        root /Volumes/ztx-1t/zackblog/dist;
        index index.html;

        # 配置dist/happy-birthday目录访问
        location /happy-birthday {
            alias /Volumes/ztx-1t/zackblog/dist/happy-birthday;
            index index.html;
            autoindex off;  # 明确禁用目录索引
            try_files $uri $uri/index.html =404;
        }

        # 处理带尾部斜杠的情况
        location /happy-birthday/ {
            alias /Volumes/ztx-1t/zackblog/dist/happy-birthday/;
            index index.html;
            autoindex off;  # 明确禁用目录索引
            try_files $uri $uri/index.html =404;
        }

        # 静态文件处理
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # 主网站其他路径配置
        location / {
            try_files $uri $uri.html =404;
        }

        # 保护隐藏文件和敏感文件
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* \.(conf|ini|log|sh)$ {
            deny all;
            return 404;
        }

        # 错误页面配置
        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 500 502 503 504 /500.html;

        # 日志配置（使用用户可写的路径）
        access_log /tmp/nginx-access.log;
        error_log /tmp/nginx-error.log;
    }
}