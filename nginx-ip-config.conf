# 适合IP地址访问的Nginx配置文件
# 将此配置文件保存到服务器的 /etc/nginx/conf.d/ 目录下

# 针对IP地址访问的配置
server {
    # 监听所有IP的80端口
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # 不指定server_name，这样会响应所有未匹配到其他server块的请求
    # server_name可以完全省略，或者设置为服务器的IP地址
    
    # 设置网站根目录，指向Astro构建后的dist目录
    # 请根据实际情况修改路径
    root /path/to/your/blog/dist;
    index index.html;
    
    # 配置静态文件缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # 处理SPA路由，确保直接访问子页面时能正确加载
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 自定义404页面
    error_page 404 /404.html;
    
    # 记录访问日志
    access_log /var/log/nginx/ip-access.log;
    error_log /var/log/nginx/ip-error.log;
}

# 排查IP访问问题的步骤：
# 1. 确认Nginx配置正确：
#    - 使用命令：nginx -t 检查配置语法
#    - 使用命令：systemctl reload nginx 或 service nginx reload 重载配置
# 2. 检查服务器防火墙设置：
#    - 确认80端口已开放
#    - 可使用：iptables -L -n 或 firewall-cmd --list-ports 查看
# 3. 检查服务器网络连接：
#    - 确认服务器IP地址正确
#    - 使用ping命令测试网络连通性
# 4. 检查Nginx服务状态：
#    - 使用命令：systemctl status nginx 或 service nginx status
# 5. 查看Nginx错误日志：
#    - 默认位置：/var/log/nginx/error.log