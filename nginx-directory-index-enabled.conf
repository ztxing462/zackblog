# Nginx 目录索引启用配置文件

# 此配置允许访问目录索引，特别适用于您需要直接访问blog目录中文章的需求

server {
    listen 80;
    server_name _;
    root /Volumes/ztx-1t/zackblog/dist;
    index index.html;
    charset utf-8;

    # 全局目录索引设置（默认禁用，然后针对特定目录启用）
    autoindex off;
    # 美化目录索引显示
    autoindex_exact_size off;
    autoindex_localtime on;
    # 添加图标显示
    autoindex_format html;

    # 为blog目录启用目录索引
    # 这样您可以直接访问 http://your-ip/blog/ 查看所有文章列表
    location /blog/ {
        # 启用目录索引
        autoindex on;
        # 添加友好的标题
        add_before_body /_autoindex_header.html;
        # 尝试请求的文件，然后是目录索引，最后是blog.html
        try_files $uri $uri/ /blog.html =404;
    }

    # 为其他可能包含文章的目录也启用索引
    location /docs/ {
        autoindex on;
        add_before_body /_autoindex_header.html;
        try_files $uri $uri/ /docs.html =404;
    }

    location /tags/ {
        autoindex on;
        add_before_body /_autoindex_header.html;
        try_files $uri $uri/ /tags.html =404;
    }

    # 归档页面保持原有配置
    location /archives {
        try_files $uri $uri/index.html /archives.html =404;
    }

    # 关于页面保持原有配置
    location /about {
        try_files $uri $uri/index.html /about.html =404;
    }

    # 处理其他目录请求
    location ~ /$ {
        # 对于其他以/结尾的请求，先尝试index.html，再尝试目录索引
        try_files $uri/index.html $uri.html $uri =404;
    }

    # 静态文件处理
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 保护配置文件和敏感文件不被访问
    location ~* \.(conf|ini|log|sh|php|py|pl|cgi)$ {
        deny all;
        return 404;
    }

    # 保护隐藏文件（以.开头的文件）
    location ~ /\. {
        deny all;
        return 404;
    }

    # 通用路由处理
    location / {
        try_files $uri $uri.html /index.html =404;
    }

    # 自定义错误页面
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /500.html;

    # 确保错误页面能够正确提供
    location = /404.html {
        internal;
    }
    location = /403.html {
        internal;
    }
    location = /500.html {
        internal;
    }
}

# 创建一个美化的目录索引头部文件
# 请在dist目录下创建此文件以美化目录索引页面
#
# /Volumes/ztx-1t/zackblog/dist/_autoindex_header.html
#
# <!DOCTYPE html>
# <html>
# <head>
#     <meta charset="utf-8">
#     <title>目录索引</title>
#     <style>
#         body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 20px; }
#         h1 { color: #333; margin-bottom: 20px; }
#         table { width: 100%; border-collapse: collapse; }
#         th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #ddd; }
#         th { background-color: #f2f2f2; }
#         a { color: #0366d6; text-decoration: none; }
#         a:hover { text-decoration: underline; }
#         .parent { margin-bottom: 15px; }
#     </style>
# </head>
# <body>
#     <h1>文件目录</h1>

# 使用说明：
# 1. 将此配置文件保存为 nginx-directory-index-enabled.conf
# 2. 在dist目录下创建_autoindex_header.html文件（内容如上）
# 3. 测试配置语法：sudo nginx -t
# 4. 部署配置：sudo cp nginx-directory-index-enabled.conf /etc/nginx/conf.d/zackblog.conf
# 5. 重启Nginx：sudo systemctl reload nginx 或 sudo service nginx reload
#
# 访问方式：
# - 主页：http://your-ip/
# - 文章目录：http://your-ip/blog/
# - 特定文章：http://your-ip/blog/article-name.html
#
# 注意事项：
# - 目录索引会暴露文件结构，请确保没有敏感文件在可访问目录中
# - 如果需要密码保护，可以添加HTTP Basic Authentication
# - 定期检查服务器日志，确保没有未授权访问尝试