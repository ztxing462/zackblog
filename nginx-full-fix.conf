# Nginx 完整修复配置文件

# 此配置文件专门解决页面重定向问题，确保所有页面都能正确访问
# 特别针对 archives.html、about.html 和 blog 文章无法正确访问的问题

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /Volumes/ztx-1t/zackblog/dist;
    index index.html;
    charset utf-8;

    # 禁用服务器签名，提高安全性
    server_tokens off;

    # 防止在URL末尾添加斜杠导致的重定向问题
    merge_slashes off;

    # 允许目录索引（针对blog目录）
    location /blog/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri.html =404;
    }

    # 确保 archives.html 可以直接访问
    location = /archives.html {
        try_files $uri =404;
    }

    # 确保 about.html 可以直接访问
    location = /about.html {
        try_files $uri =404;
    }

    # 确保 blog.html 可以直接访问
    location = /blog.html {
        try_files $uri =404;
    }

    # 处理 archives 路径访问
    location /archives {
        try_files $uri $uri.html =404;
    }

    # 处理 about 路径访问
    location /about {
        try_files $uri $uri.html =404;
    }

    # 处理 blog 路径访问
    location /blog {
        try_files $uri $uri.html =404;
    }

    # 处理单个博客文章的访问
    location ~ /blog/[^/]+\.html$ {
        try_files $uri =404;
    }

    # 静态文件处理 - 添加适当的MIME类型和缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 保护配置文件和敏感文件
    location ~* \.(conf|ini|log|sh|php|py|pl|cgi)$ {
        deny all;
        return 404;
    }

    # 保护隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 主页面访问 - 注意这是最后一个location块，确保前面的特定路径优先处理
    location / {
        try_files $uri $uri.html =404;
    }

    # 自定义错误页面
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /500.html;

    # 确保错误页面能够正确提供
    location = /404.html {
        internal;
    }
    location = /403.html {
        internal;
    }
    location = /500.html {
        internal;
    }

    # 日志配置
    access_log /var/log/nginx/zackblog_access.log;
    error_log /var/log/nginx/zackblog_error.log debug;
}

# =====================================================
#                 应用此配置的详细步骤
# =====================================================

# 1. 首先备份当前的Nginx配置
# sudo cp /etc/nginx/conf.d/zackblog.conf /etc/nginx/conf.d/zackblog.conf.backup
# sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.backup

# 2. 将此配置文件复制到Nginx配置目录
# sudo cp /Volumes/ztx-1t/zackblog/nginx-full-fix.conf /etc/nginx/conf.d/zackblog.conf

# 3. 测试配置语法是否正确
# sudo nginx -t

# 4. 重载Nginx配置
# sudo systemctl reload nginx
# 或者
# sudo service nginx reload

# 5. 清除浏览器缓存或使用隐身模式测试

# =====================================================
#                   问题排查步骤
# =====================================================

# 如果配置应用后仍然存在问题，请按照以下步骤排查：

# 1. 检查是否有其他配置文件冲突
# ls -la /etc/nginx/conf.d/
# ls -la /etc/nginx/sites-enabled/

# 2. 查看Nginx错误日志
# sudo tail -f /var/log/nginx/error.log
# sudo tail -f /var/log/nginx/zackblog_error.log

# 3. 检查文件权限
# sudo chown -R www-data:www-data /Volumes/ztx-1t/zackblog/dist
# sudo chmod -R 755 /Volumes/ztx-1t/zackblog/dist

# 4. 检查Nginx用户是否有权限访问文件
# sudo -u www-data ls -la /Volumes/ztx-1t/zackblog/dist
# sudo -u www-data cat /Volumes/ztx-1t/zackblog/dist/archives.html

# 5. 使用curl命令测试直接访问文件
# curl -v http://localhost/archives.html
# curl -v http://localhost/about.html
# curl -v http://localhost/blog/

# 6. 确认没有其他服务占用80端口
# sudo netstat -tuln | grep :80

# =====================================================
#             常见问题及解决方案
# =====================================================

# 问题：所有请求仍然重定向到index.html
# 解决：
# 1. 检查是否有其他配置文件覆盖了当前配置
# 2. 确保location块的顺序正确（特定路径在前，通用路径在后）
# 3. 禁用可能的重定向模块

# 问题：权限被拒绝错误
# 解决：
# 1. 检查文件和目录权限
# 2. 确认Nginx用户（通常是www-data或nginx）有访问权限
# 3. 检查SELinux设置（如果使用）

# 问题：404 Not Found错误
# 解决：
# 1. 确认文件确实存在于dist目录中
# 2. 检查文件路径是否正确
# 3. 查看Nginx错误日志以获取详细信息

# 配置说明：
# - 使用default_server确保此配置是默认配置
# - 为每个主要页面创建了精确的location匹配
# - 特别处理了.html文件的直接访问
# - 调整了try_files指令的顺序，确保优先尝试精确匹配
# - 添加了详细的日志记录以便排查问题
# - 提供了完整的应用和排查步骤