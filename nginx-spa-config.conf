# 适合Astro静态网站的Nginx配置文件
# 解决只能显示首页，无法访问blog等其他页面的问题
# 将此配置文件保存到服务器的 /etc/nginx/conf.d/ 目录下

server {
    # 监听所有IP的80端口
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # 不指定server_name，这样会响应所有未匹配到其他server块的请求
    # 也可以设置为您的域名或IP地址
    # server_name example.com 192.168.1.100;
    
    # 设置网站根目录，指向Astro构建后的dist目录
    # 请根据实际情况修改路径
    root /path/to/your/blog/dist;
    index index.html;
    
    # 重要：配置charset以确保中文正常显示
    charset utf-8;
    
    # 配置静态文件缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # 确保静态文件直接返回，不进行rewrite
        try_files $uri =404;
    }
    
    # 处理SPA路由，确保直接访问子页面时能正确加载
    # 这是解决只能访问首页的关键配置
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 为特定目录添加更精确的路由处理（可选）
    # 例如处理blog、docs等子目录
    location ~ ^/(blog|docs|about|projects|links|tags|search|archives) {
        try_files $uri $uri/ /index.html;
    }
    
    # 自定义404页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    # 自定义500错误页面
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        internal;
    }
    
    # 禁止访问隐藏文件（如.git、.env等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 防止静态文件被解析为脚本
    location ~* \.(txt|md|log|yml|yaml)$ {
        add_header Content-Type text/plain;
        try_files $uri =404;
    }
    
    # 增加请求体大小限制（根据需要调整）
    client_max_body_size 20m;
    
    # 配置请求超时时间
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65;
    send_timeout 10s;
    
    # 记录访问日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

