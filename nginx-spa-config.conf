### 配置说明与常见问题解决

## 为什么只能显示首页，其他页面无法访问？
这通常是因为Nginx没有正确配置SPA（单页应用）路由。静态网站生成后，所有路由都需要指向index.html，然后由前端JavaScript处理路由跳转。

## 关键配置说明
1. **try_files $uri $uri/ /index.html;**
   - 这是最重要的配置，它会首先尝试访问请求的文件或目录，如果不存在，则重定向到index.html
   - 这样可以确保所有路由请求都被正确处理

2. **静态文件处理**
   - 为静态文件设置了专门的location块，确保它们直接返回而不经过rewrite
   - 添加了缓存控制，提高网站性能

3. **特定目录的路由处理**
   - 为常用的页面目录（如blog、docs等）添加了专门的location块，确保它们能被正确路由

## 配置步骤
1. 将上面的配置文件复制到服务器的 `/etc/nginx/conf.d/` 目录
2. 修改 `root` 指令中的路径，指向您实际的Astro构建目录
3. 检查配置语法：`sudo nginx -t`
4. 重载Nginx配置：`sudo systemctl reload nginx` 或 `sudo service nginx reload`
5. 清除浏览器缓存后测试网站访问

## 常见问题排查

### 如果修改后仍然无法访问其他页面
1. 检查Nginx错误日志：`sudo tail -f /var/log/nginx/error.log`
2. 确认dist目录权限正确：`sudo chown -R www-data:www-data /path/to/your/blog/dist`
3. 确认dist目录中确实存在生成的文件：`ls -la /path/to/your/blog/dist`
4. 检查是否有其他Nginx配置文件冲突：`sudo ls -la /etc/nginx/conf.d/`
5. 尝试使用curl命令测试：`curl -I http://您的IP地址/blog`

### 如果出现404错误
1. 确认Astro构建是否成功：`ls -la /path/to/your/blog/dist`
2. 检查Nginx配置中的root路径是否正确
3. 确保try_files指令配置正确

### 如果出现500错误
1. 查看错误日志获取具体信息
2. 检查文件权限
3. 检查SELinux或AppArmor设置

完成以上配置后，您的网站应该能够正常显示所有页面，包括blog、docs等子页面。